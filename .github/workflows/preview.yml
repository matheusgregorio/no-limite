# Cada PR ganha um preview em https://matheusgregorio.github.io/no-limite/pr-preview/pr-<número>/
# O link aparece num comentário do PR e o preview é apagado quando o PR fecha.
name: Preview do PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar arquivos do site
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude 'netlify.toml' ./ _site/

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
